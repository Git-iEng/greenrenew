<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{% static 'css/demo_form.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/header.css' %}">
</head>

<body>
  {% include 'request_demo_modal.html' %}

  <header class="header">
    <nav class="nav container" aria-label="Primary">
      <div class="nav__data">
        <a href="#home" class="nav__logo" data-scroll-to>
          <img src="{% static 'images/logo.png' %}" alt="Company Logo" class="logo-img">
        </a>

        <button class="nav__toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-menu">
          <i class="ri-menu-line nav__burger"></i>
          <i class="ri-close-line nav__close"></i>
        </button>
      </div>

      <div class="nav__menu" id="nav-menu">
        <ul class="nav__list">
          <li class="dropdown__item"><a href="#overview" class="nav__link" data-scroll-to>We Provide</a></li>
          <li class="dropdown__item"><a href="#products" class="nav__link" data-scroll-to>Our Expertise</a></li>
          <li class="dropdown__item"><a href="#projects" class="nav__link" data-scroll-to>Project</a></li>
          <li class="dropdown__item"><a href="#gallery" class="nav__link" data-scroll-to>Gallery</a></li>
          
          <li class="dropdown__item"><a href="#about-us" class="nav__link" data-scroll-to>About Us</a></li>
          <li class="dropdown__item"><a href="#contact" class="nav__link" data-scroll-to>Contact</a></li>
          <li class="dropdown__item nav__cta-item">
            <button type="button" class="book-demo-btn js-open-demo">
              Submit Inquiry
            </button>
          </li>
        </ul>
      </div>
    </nav>
  </header>

  <script src="{% static 'js/header.js' %}"></script>
  <script defer src="{% static 'js/demo_form.js' %}"></script>
</body>
</html>
